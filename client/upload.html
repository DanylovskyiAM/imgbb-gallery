<!DOCTYPE html>
<html>
<head>
  <title>Upload Photos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="upload-page">

<header class="header">
  <div class="container header-inner">
    <section class="page-header">
      <h2>Upload Photos</h2>
      <h3>Send images to ImgBB storage</h3>
    </section>
    <a class="header-link" href="/">Gallery</a>
  </div>
</header>

<main class="main upload-main">
  <section class="upload-panel">
    <form id="uploadForm" class="upload-form">
      <label for="uploadInput">Choose photos</label>
      <input id="uploadInput" type="file" accept="image/*" multiple />

      <div class="expiration-field">
        <label for="expirationSelect">Expiration</label>
        <select id="expirationSelect" name="expiration">
          <option value="">Never</option>
          <option value="3600">Hourly</option>
          <option value="86400">Daily</option>
          <option value="604800" selected>Weekly</option>
          <option value="2592000">Monthly</option>
        </select>
      </div>

      <button type="submit">Upload</button>
    </form>

    <p id="uploadStatus" class="upload-status"></p>
    <div id="uploadResults" class="upload-results"></div>
  </section>
</main>

<script src="upload.js"></script>
</body>
</html>
