<!DOCTYPE html>
<html>
<head>
  <title>Manage Folders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <section class="page-header">
      <h2>Manage Folders</h2>
      <h3>Create folders and approve uploaded files</h3>
    </section>
    <div class="header-actions manage-header-actions">
      <button id="exportDbBtn" type="button">Export</button>
      <button id="openImportDbBtn" type="button">Import</button>
    </div>
  </div>
</header>

<main class="main manage-main">
  <section class="manage-panel">
    <div class="manage-grid">
      <div class="folders-column">
        <div class="files-panel-header">
          <h3>Folders</h3>
          <div class="manage-actions">
            <button id="addRootFolderBtn" type="button">+ Folder</button>
          </div>
        </div>
        <div id="folderList" class="folder-tree"></div>
      </div>
      <div class="files-column">
        <div class="files-panel-header">
          <div class="files-title-block">
            <h3 id="filesTitle">Files</h3>
            <span id="filesSubtitle"></span>
          </div>
          <div id="bulkFileActions" class="manage-actions hidden">
            <button id="approveAllBtn" type="button">Approve all</button>
            <button id="deleteAllBtn" class="danger-action" type="button">Delete all</button>
          </div>
        </div>
        <div id="fileList" class="manage-file-grid"></div>
      </div>
    </div>
  </section>
</main>

<div id="modal">
  <span id="close">&times;</span>

  <div id="prev" class="nav-arrow">&#10094;</div>
  <img id="modal-img" />
  <div id="next" class="nav-arrow">&#10095;</div>

  <div class="modal-actions manage-modal-actions">
    <div id="counter"></div>
    <a id="downloadBtn">Download</a>
    <button id="modalApproveBtn" type="button">Approve</button>
    <button id="modalDeleteBtn" class="danger-action" type="button">Delete</button>
  </div>
</div>

<div id="addFolderModal" class="edit-folder-modal hidden">
  <form id="addFolderForm" class="edit-folder-dialog">
    <h3>Add folder</h3>
    <label>
      Parent folder
      <select id="addParentFolder"></select>
    </label>
    <label>
      Name
      <input id="addFolderName" type="text" />
    </label>
    <label>
      Description
      <textarea id="addFolderDescription" rows="4"></textarea>
    </label>
    <div class="edit-folder-actions">
      <button id="cancelAddFolder" type="button">Cancel</button>
      <button type="submit">Create</button>
    </div>
  </form>
</div>

<div id="exportModal" class="edit-folder-modal hidden">
  <div class="edit-folder-dialog">
    <h3>Export</h3>
    <div class="export-options">
      <button id="exportBackupBtn" type="button">Export DB backup</button>
      <button id="exportExcelBtn" type="button">Export to Excel</button>
    </div>
    <p class="import-status">Excel export includes only folders without child folders.</p>
    <div class="edit-folder-actions">
      <button id="cancelExport" type="button">Cancel</button>
    </div>
  </div>
</div>

<div id="importDbModal" class="edit-folder-modal hidden">
  <form id="importDbForm" class="edit-folder-dialog">
    <h3>Import database</h3>
    <label>
      Backup file
      <input id="importDbFile" type="file" accept=".zip,.json,application/zip,application/json" />
    </label>
    <fieldset class="import-mode-options">
      <legend>Import mode</legend>
      <label>
        <input type="radio" name="importMode" value="update" checked />
        Update existing database
      </label>
      <label>
        <input type="radio" name="importMode" value="replace" />
        Replace database
      </label>
    </fieldset>
    <p id="importDbStatus" class="import-status"></p>
    <div id="importDbActions" class="edit-folder-actions">
      <button id="cancelImportDb" type="button">Cancel</button>
      <button type="submit">Import</button>
    </div>
    <div id="importDbCloseActions" class="edit-folder-actions hidden">
      <button id="closeImportDb" type="button">Close</button>
    </div>
  </form>
</div>

<div id="editFolderModal" class="edit-folder-modal hidden">
  <form id="editFolderForm" class="edit-folder-dialog">
    <h3>Edit folder</h3>
    <label>
      Name
      <input id="editFolderName" type="text" />
    </label>
    <label>
      Description
      <textarea id="editFolderDescription" rows="4"></textarea>
    </label>
    <div class="edit-folder-actions">
      <button id="cancelEditFolder" type="button">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</div>

<button type="button" id="toTopBtn" class="to-top-btn" aria-label="Scroll to top">
  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="m5 12 7-7 7 7"></path>
    <path d="M12 19V5"></path>
  </svg>
</button>

<script src="manage.js"></script>
</body>
</html>
