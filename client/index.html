<!DOCTYPE html>
<html>
<head>
  <title>Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="container header-inner">
    <section class="page-header">
      <h2>title</h2>
      <h3>subtitle</h3>
    </section>
    <span id="photoCount" class="photo-count"></span>
    <button id="downloadAll">Download All</button>
  </div>
</header>


<!-- MAIN -->
<main class="main">
    <div id="gallery"></div>
</main>

<!-- MODAL (unchanged) -->
<div id="modal">
  <span id="close">&times;</span>

  <div id="prev" class="nav-arrow">&#10094;</div>
  <img id="modal-img" />
  <div id="next" class="nav-arrow">&#10095;</div>

  <div class="modal-actions">
    <div id="counter"></div>
    <a id="downloadBtn">Download</a>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="container footer-top">

    <!-- LEFT: App buttons -->
    <div class="footer-apps">
        <a href="#">
          <img src="img/store-ios-app.png" height="40">
        </a>

        <a href="#">
          <img src="img/store-android-app.png" height="40">
        </a>
    </div>

    <!-- RIGHT: Contacts -->
    <div class="footer-contact">
        <div class="contact-row">
            <span class="contact-item">
              <svg width="16" height="16" fill="#52525c" viewBox="0 0 24 24">
                <path d="M6.6 10.8c1.4 2.7 3.9 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3
                1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1v3.5c0 .6-.4 1-1 1C10.7 21 3 13.3 3 4.5
                3 3.9 3.4 3.5 4 3.5H7.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3
                1.1l-2.2 2.4z"/>
              </svg>
              +1 (234) 567-890
            </span>
            <span class="contact-item">
              <svg width="16" height="16" fill="#52525c" viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9
                2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
              info@promosport.com
            </span>
        </div>
      <div class="copyright">
        ©Copyright 2026, All Rights Reserved by Promosport
        <a class="underline lowercase cursor-pointer" href="https://mya-app-v2.azurewebsites.net/en/pr1/privacy-policy">Privacy Policy</a> / <a class="underline lowercase cursor-pointer" href="https://mya-app-v2.azurewebsites.net/en/pr1/tos">Terms &amp; Conditions</a>
      </div>
    </div>

  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>

</body>
</html>
